services:
  sinkhole:
    image: ${SINKHOLE_IMAGE:-network-wide-dns-sinkhole:local}
    build:
      context: .
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${SINKHOLE_DNS_PORT:-53}:53/udp"
      - "${SINKHOLE_DNS_PORT:-53}:53/tcp"
      - "${SINKHOLE_WEB_PORT:-8080}:8080/tcp"
    environment:
      SINKHOLE_DNS_LISTEN: ":53"
      SINKHOLE_HTTP_LISTEN: ":8080"
      SINKHOLE_DATA_DIR: /data
      SINKHOLE_UPSTREAMS: ${SINKHOLE_UPSTREAMS:-1.1.1.1:53,1.0.0.1:53}
      SINKHOLE_DNS_TIMEOUT: ${SINKHOLE_DNS_TIMEOUT:-5s}
      SINKHOLE_DNS_MAX_INFLIGHT: ${SINKHOLE_DNS_MAX_INFLIGHT:-256}
      SINKHOLE_QUERY_RETENTION: ${SINKHOLE_QUERY_RETENTION:-720h}
      SINKHOLE_BLOCKLIST_REFRESH: ${SINKHOLE_BLOCKLIST_REFRESH:-24h}
      SINKHOLE_LOG_LEVEL: ${SINKHOLE_LOG_LEVEL:-info}
      SINKHOLE_LOG_FORMAT: ${SINKHOLE_LOG_FORMAT:-json}
    volumes:
      - sinkhole-data:/data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  sinkhole-data:
    name: sinkhole-data
