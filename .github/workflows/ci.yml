name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            echo "Go files need formatting:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sinkhole:ci .
      - name: Run container
        run: |
          docker run -d --name sinkhole-ci \
            --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true \
            -p 15353:53/udp -p 15353:53/tcp -p 18080:8080 \
            -e SINKHOLE_UPSTREAMS=1.1.1.1:53 \
            sinkhole:ci
      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/api/health
          curl --fail --silent http://127.0.0.1:18080/ | grep -q '<title>Sinkhole'
          curl --fail --silent -X POST \
            -H 'Content-Type: application/json' \
            -d '{"domain":"ci-blocked.test","type":"deny"}' \
            http://127.0.0.1:18080/api/rules
      - name: Container logs
        if: always()
        run: docker logs sinkhole-ci
      - name: Cleanup
        if: always()
        run: docker rm -f sinkhole-ci
